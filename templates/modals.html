<!-- Upload Modal -->
<div id="uploadModal" class="modal hidden">
    <div class="modal-content">
        <span class="close" id="closeModal">&times;</span>
        <h2>Upload Files</h2>
        <form id="uploadForm" action="/upload" method="post" enc="multipart/form-data">
            <div id="progressContainer">
              <h5>File Upload Progress: </h5>
                <div class="current-task">
                    <span id="currentTask">Current Task: Initializing...  </span>                           
                </div>
                <div class="overall-progress">
                    <label>Overall Progress:</label>
                    <div id="errorMsg" style="color: red; display: none;">Error: </div>
                    <div id="successMsg" style="color: green; display: none;">Success: </div>

                    <div class="progress">
                        <div class="progress-bar" role="progressbar" style="width: 0%;" id="overallProgress" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                    </div>
                    <div class="dial"></div>
                </div>
                <div class="file-progress">
                    <label>File Progress:</label>
                    <div id="fileProgressContainer">
                    </div>
                </div>
                <progress id="uploadProgress" value="0" max="100"></progress>
                <span id="progressText">0%</span>
            </div>
            <div class="blender-installation" id="blenderInstallationSection" style="display: none;">
                <label>Blender Installation Progress:</label>
                <div class="progress">
                    <div class="progress-bar" role="progressbar" style="width: 0%;" id="blenderProgress" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                </div>
            </div>
            <div class="modal-buttons">
                <input type="file" id="fileInput" class="modalBtn" name="files" multiple />
                <button id="uploadModalBtn" class="modalBtn">Start Upload</button>
            </div>
            <p>The contents uploaded will be displayed on both the admin site and the guest site</p>
        </form>
    </div>
  </div>
